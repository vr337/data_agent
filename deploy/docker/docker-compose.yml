name: data_agent
services:

  mysql:
    image: mysql:8.4
    container_name: data_agent_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: vr337
      MYSQL_USER: vr337
      MYSQL_PASSWORD: vr337
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci

  elasticsearch:
    build: ./elasticsearch
    image: docker-elasticsearch:latest
    container_name: data_agent_elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kibana:
    image: kibana:8.19.10
    container_name: data_agent_kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  qdrant:
    image: qdrant/qdrant:v1.16
    container_name: data_agent_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    container_name: data_agent_embedding
    restart: unless-stopped
    ports:
      - "8899:80"
    environment:
      MODEL_ID: BAAI/bge-large-zh-v1.5        
      HF_ENDPOINT: https://hf-mirror.com      
      MAX_CONCURRENT_REQUESTS: "16"
      MAX_BATCH_TOKENS: "16384"
    volumes:
      - ./embedding/cache:/data               

volumes:
  mysql_data:
  es_data:
  qdrant_data: